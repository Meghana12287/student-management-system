{% extends "base.html" %}
{% block title %}{{ mode }} student · Campus Register{% endblock %}
{% block content %}
<header class="page-head"><h1>{{ mode }} student</h1></header>
<form method="post" class="panel form-grid">
  <label>Roll number<input name="roll_no" value="{{ s.roll_no or '' }}" required></label>
  <label>Full name<input name="name" value="{{ s.name or '' }}" required></label>
  <label>Email<input name="email" type="email" value="{{ s.email or '' }}"></label>
  <label>Phone<input name="phone" value="{{ s.phone or '' }}"></label>
  <label>Course
    <select name="course">{% for c in courses %}<option {{ 'selected' if c == s.course }}>{{ c }}</option>{% endfor %}</select></label>
  <label>Year
    <select name="year">{% for y in [1,2,3,4] %}<option value="{{ y }}" {{ 'selected' if y == s.year }}>Year {{ y }}</option>{% endfor %}</select></label>
  <label>GPA (0–10)<input name="gpa" type="number" step="0.01" min="0" max="10" value="{{ s.gpa if s.gpa is not none else '' }}"></label>
  <label>Status
    <select name="status">{% for t in statuses %}<option {{ 'selected' if t == s.status }}>{{ t }}</option>{% endfor %}</select></label>
  <div class="form-actions">
    <button class="btn">Save student</button>
    <a class="btn ghost" href="{{ url_for('students') }}">Cancel</a>
  </div>
</form>
{% endblock %}
