{% extends "base.html" %}
{% block title %}Log in · Campus Register{% endblock %}
{% block content %}
<div class="login">
  <div class="login-art">
    <h1>Every student,<br>one clear record.</h1>
    <p>Enrol, update and find students in seconds.</p>
  </div>
  <form method="post" class="login-card">
    <h2>Log in</h2>
    <label>Username<input name="username" value="admin" required autofocus></label>
    <label>Password<input name="password" type="password" required></label>
    <button class="btn">Log in</button>
    <p class="hint">Demo account: admin / admin123</p>
  </form>
</div>
{% endblock %}
